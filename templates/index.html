
<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 30px;
        }

        h1, h2 {
            color: #203864;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        form, table {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        input {
            padding: 10px;
            margin: 6px 0 12px;
            width: 100%;
            box-sizing: border-box;
        }

        button, .edit {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            color: white;
            background: #1769aa;
            cursor: pointer;
            text-decoration: none;
        }

        .delete {
            background: #d93025;
        }

        table {
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #203864;
            color: white;
        }

        .actions {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>
<div class="container">

    <h1>Student Management System</h1>

    <h2>Add New Student</h2>

    <form method="POST" action="/">
        <label>Student Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Course</label>
        <input type="text" name="course" required>

        <label>Age</label>
        <input type="number" name="age"
               min="1" max="120" required>

        <button type="submit">Add Student</button>
    </form>

    <h2>Student Records</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Age</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.course }}</td>
            <td>{{ student.age }}</td>
            <td>
                <div class="actions">
                    <a class="edit"
                       href="{{ url_for('edit', id=student.id) }}">
                        Edit
                    </a>

                    <form method="POST"
                          action="{{ url_for('delete', id=student.id) }}"
                          onsubmit="return confirm('Delete this student?')"
                          style="padding:0; width:auto;">
                        <button class="delete" type="submit">
                            Delete
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="6">No students registered yet.</td>
        </tr>
        {% endfor %}
    </table>

</div>
</body>
</html>
