
<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 40px;
        }

        form {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            box-sizing: border-box;
        }

        button, a {
            background: #1769aa;
            color: white;
            padding: 10px 14px;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1 style="text-align:center">Edit Student Details</h1>

<form method="POST">
    <label>Name</label>
    <input type="text" name="name"
           value="{{ student.name }}" required>

    <label>Email</label>
    <input type="email" name="email"
           value="{{ student.email }}" required>

    <label>Course</label>
    <input type="text" name="course"
           value="{{ student.course }}" required>

    <label>Age</label>
    <input type="number" name="age"
           value="{{ student.age }}"
           min="1" max="120" required>

    <button type="submit">Update Student</button>
    <a href="{{ url_for('index') }}">Back</a>
</form>

</body>
</html>
